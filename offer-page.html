<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Performance Solution</title>
    <style>
        /* General page reset and font styling */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Main content area containing the text and buttons */
        .content-container {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            margin-left: 40px; /* Aligns content slightly to the left like the image */
        }

        /* Main headline styling */
        .headline {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.3;
            color: #000000;
            margin-bottom: 20px;
        }

        /* Red highlighted text styling */
        .highlight-red {
            color: #cc0000;
            text-decoration: underline;
        }

        /* Offer text styling */
        .offer-text {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Image placeholder */
        .image-placeholder {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background-color: #f0f0f0;
            border: 2px dashed #cccccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999999;
            font-size: 15px;
            margin-bottom: 35px;
        }

        /* Container to stack the buttons vertically */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 340px; /* Restricts button width to match the layout */
        }

        /* Base button styles shared by both buttons */
        .btn {
            display: block;
            text-align: center;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px; /* Creates the rounded capsule shape */
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Specific colors for individual buttons */
        .btn-red {
            background-color: #990000;
        }

        .btn-black {
            background-color: #000000;
        }

        /* Footer styling at the bottom of the page */
        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Main Content Section -->
    <div class="content-container">
        <h1 class="headline">
            Advanced & <span class="highlight-red">Performance Solution</span> For Men
        </h1>

        <p class="offer-text">
            Buy 3 Packs Of Performance Coffee Capsules, Get 1 Pack For Free + Free Delivery
        </p>

        <!-- Replace this placeholder div with your actual <img> tag once you have the asset -->
        <div class="image-placeholder">
            [ Image goes here ]
        </div>

        <div class="button-group">
            <!-- Replace the '#' with your actual links when you have them -->
            <a href="#" class="btn btn-red">Claim This Offer Now</a>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>Copyright &copy; 2026. TSH HERBAL</p>
        <p>This site is not a part of Facebook website or Facebook Inc.</p>
    </footer>

</body>
</html>
